name: Pages

# Publishes the web build to GitHub Pages so anyone can play at
# https://xtoki420x.github.io/Ringers/ (iPhone, Android or desktop browser).
# The built game goes to the gh-pages branch; in the repository settings,
# Pages → Build and deployment → Source is "Deploy from a branch", gh-pages, / (root).

on:
  push:
    branches: [main, claude/horseshoe-tournament-game-dy5r3d]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          commit_message: Publish Ringers
